<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Bot Controller</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #090d16; color: #f1f5f9; padding: 16px; }
    .app { max-width: 440px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
    .badge { padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .online { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid #10b981; }
    .offline { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid #ef4444; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box { background: #0b1120; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; }
    .stat-label { font-size: 11px; color: #94a3b8; }
    .stat-val { font-size: 17px; font-weight: 700; margin-top: 4px; }
    .profit { color: #34d399; }
    .loss { color: #f87171; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    button { border: none; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-start-on { background: #10b981; color: #052e16; }
    .btn-start-off { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .btn-hold-on { background: #f59e0b; color: #271700; }
    .btn-hold-off { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .btn-save { width: 100%; background: #3b82f6; color: white; margin-top: 8px; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0b1120; color: #fff; margin-top: 6px; }
    .debug { font-size: 11px; color: #94a3b8; margin-top: 8px; word-break: break-word; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div>
        <div style="font-weight:800;font-size:18px;">CLOUD BOT V1</div>
        <div id="subInfo" style="font-size:12px;color:#94a3b8;">Akaun: - | Simbol: -</div>
      </div>
      <span id="connBadge" class="badge offline">OFFLINE</span>
    </div>

    <div class="card">
      <div class="grid-2">
        <div class="stat-box">
          <div class="stat-label">BALANCE</div>
          <div id="balanceVal" class="stat-val">$0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">PROFIT TODAY</div>
          <div id="profitVal" class="stat-val profit">+$0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">FLOATING P&L</div>
          <div id="floatingVal" class="stat-val">$0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">OPEN POSITIONS</div>
          <div id="posVal" class="stat-val">0</div>
        </div>
      </div>
      <div id="debugInfo" class="debug">Menyambung ke Supabase...</div>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:14px;">KAWALAN ROBOT</div>
      <div class="controls">
        <button id="btnStart" class="btn-start-off" onclick="toggleStart()">START: OFF</button>
        <button id="btnHold" class="btn-hold-off" onclick="toggleHold()">HOLD: OFF</button>
      </div>

      <div style="margin-top:14px;">
        <label style="font-size:12px;color:#94a3b8;">Lot Size</label>
        <input id="lotInput" type="number" step="0.01" min="0.01" value="0.01" />
        <button id="btnSaveLot" class="btn-save" onclick="saveLot()">Simpan Lot</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hvvpuhyxnuugslflmtou.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2dnB1aHl4bnV1Z3NsZmxtdG91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU4MDIxNzIsImV4cCI6MjExMTM3ODE3Mn0.8V1Km8SO0liSD5xCTwKUAS75Vqph0WfoIolvFoVD5P4";
    const ACCOUNT_NO = "10001234";
    const ONLINE_THRESHOLD_MS = 20000;

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentState = null;

    function parseHeartbeatMs(hb) {
      if (!hb) return 0;
      const raw = String(hb).trim();
      if (!raw) return 0;
      // Tukar ruang kosong di tengah kepada 'T' jika ada, dan tambah 'Z' jika tiada offset timezone
      const iso = raw.includes("T") ? raw : raw.replace(" ", "T");
      const hasTz = /(?:Z|[+-]\d{2}:?\d{2})$/i.test(iso);
      const parsed = new Date(hasTz ? iso : iso + "Z").getTime();
      return Number.isNaN(parsed) ? 0 : parsed;
    }

    function setOfflineUI(reasonText) {
      const badge = document.getElementById("connBadge");
      badge.innerText = "OFFLINE";
      badge.className = "badge offline";
      if (reasonText) {
        document.getElementById("debugInfo").innerText = reasonText;
      }
    }

    function renderUI(row) {
      currentState = row;

      const acc = row.account_number ?? ACCOUNT_NO;
      const broker = row.broker_server || "-";
      const symbol = row.symbol || "-";
      document.getElementById("subInfo").innerText = `Akaun: ${acc} (${broker}) | ${symbol}`;

      document.getElementById("balanceVal").innerText = `$${Number(row.balance ?? 0).toFixed(2)}`;

      const profit = Number(row.profit_today ?? 0);
      const profitEl = document.getElementById("profitVal");
      profitEl.innerText = `${profit >= 0 ? "+" : ""}$${profit.toFixed(2)}`;
      profitEl.className = `stat-val ${profit >= 0 ? "profit" : "loss"}`;

      const floating = Number(row.floating_pnl ?? 0);
      const floatEl = document.getElementById("floatingVal");
      floatEl.innerText = `${floating >= 0 ? "+" : ""}$${floating.toFixed(2)}`;
      floatEl.className = `stat-val ${floating >= 0 ? "profit" : "loss"}`;

      document.getElementById("posVal").innerText = row.open_positions ?? 0;

      const lotInput = document.getElementById("lotInput");
      if (row.lot_size != null && document.activeElement !== lotInput) {
        lotInput.value = row.lot_size;
      }

      const lastBeatMs = parseHeartbeatMs(row.last_heartbeat);
      const diffMs = Date.now() - lastBeatMs;
      const isOnline = lastBeatMs > 0 && diffMs < ONLINE_THRESHOLD_MS;

      const badge = document.getElementById("connBadge");
      badge.innerText = isOnline ? "ONLINE" : "OFFLINE";
      badge.className = `badge ${isOnline ? "online" : "offline"}`;

      const ageSec = lastBeatMs > 0 ? Math.max(0, Math.round(diffMs / 1000)) : "-";
      document.getElementById("debugInfo").innerText =
        `Heartbeat: ${row.last_heartbeat || "-"} (${ageSec}s lalu)`;

      const isStarted = Boolean(row.is_started);
      const btnStart = document.getElementById("btnStart");
      btnStart.innerText = `START: ${isStarted ? "ON" : "OFF"}`;
      btnStart.className = isStarted ? "btn-start-on" : "btn-start-off";

      const isHold = Boolean(row.is_hold);
      const btnHold = document.getElementById("btnHold");
      btnHold.innerText = `HOLD: ${isHold ? "ON" : "OFF"}`;
      btnHold.className = isHold ? "btn-hold-on" : "btn-hold-off";
    }

    async function loadData() {
      try {
        const { data, error } = await db
          .from("bot_accounts")
          .select("*")
          .eq("account_number", ACCOUNT_NO)
          .limit(1);

        if (error) {
          setOfflineUI(`Ralat baca Supabase: ${error.message}`);
          return;
        }

        if (!data || data.length === 0) {
          document.getElementById("subInfo").innerText = `Akaun: ${ACCOUNT_NO} (Tidak dijumpai)`;
          setOfflineUI(`Tiada baris account_number "${ACCOUNT_NO}" dalam bot_accounts.`);
          return;
        }

        renderUI(data[0]);
      } catch (err) {
        setOfflineUI(`Ralat rangkaian/skrip: ${err.message || err}`);
      }
    }

    async function updateAccountField(patchObj) {
      try {
        const { data, error } = await db
          .from("bot_accounts")
          .update(patchObj)
          .eq("account_number", ACCOUNT_NO)
          .select()
          .limit(1);

        if (error) {
          document.getElementById("debugInfo").innerText = `Ralat kemas kini: ${error.message}`;
          return;
        }
        if (data && data[0]) {
          renderUI(data[0]);
        } else {
          await loadData();
        }
      } catch (err) {
        document.getElementById("debugInfo").innerText = `Ralat kemas kini: ${err.message || err}`;
      }
    }

    async function toggleStart() {
      if (!currentState) return;
      await updateAccountField({ is_started: !Boolean(currentState.is_started) });
    }

    async function toggleHold() {
      if (!currentState) return;
      await updateAccountField({ is_hold: !Boolean(currentState.is_hold) });
    }

    async function saveLot() {
      const lot = parseFloat(document.getElementById("lotInput").value);
      if (Number.isNaN(lot) || lot <= 0) {
        document.getElementById("debugInfo").innerText = "Lot size mesti lebih besar daripada 0.";
        return;
      }
      await updateAccountField({ lot_size: lot });
    }

    loadData();
    setInterval(loadData, 4000);
  </script>
</body>
</html>
